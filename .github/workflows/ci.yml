name: CI

on: [push, pull_request]

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run term gate if present
        run: |
          if [ -f tools/term-gate.sh ]; then
            bash tools/term-gate.sh
          else
            echo "term gate not present yet"
          fi
